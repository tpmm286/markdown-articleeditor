name: Build Cross-Platform (Web, Android APK, Windows EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-web:
    name: Build Web Package (HTML/JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Export
        env:
          NEXT_EXPORT: "true"
          GITHUB_ACTIONS: "true"
        run: bun run build

      - name: Zip Web Output
        run: cd out && zip -r ../markdown-article-editor-web.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-article-editor-web
          path: markdown-article-editor-web.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Next.js Static App
        env:
          NEXT_EXPORT: "true"
          GITHUB_ACTIONS: "true"
        run: bun run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Prepare Android
        run: |
          bun add -d @capacitor/cli @capacitor/core @capacitor/android
          # بررسی وجود پوشه out
          if [ ! -d "out" ]; then echo "out folder missing!"; exit 1; fi
          bun run cap init "Markdown Article Editor" "com.markdown.articleeditor" --web-dir out
          bun run cap add android
          bun run cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy Built APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk markdown-article-editor-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-article-editor-android-apk
          path: markdown-article-editor-android.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install   # استفاده از bun.lock

      - name: Build Next.js Static App
        env:
          NEXT_EXPORT: "true"
          GITHUB_ACTIONS: "true"
        run: bun run build

      - name: Setup Nativefier (via npm)
        run: |
          # Nativefier با npm نصب می‌شود (چون در ویندوز با Bun ممکن است مشکل داشته باشد)
          npm install -g nativefier
          nativefier --name "MarkdownArticleEditor" "out/index.html" --platform windows --arch x64 --out build-win --single-instance
          # بررسی وجود خروجی
          if (Test-Path build-win) { 
            Write-Host "Nativefier build succeeded" 
          } else { 
            Write-Error "Nativefier output not found" 
            exit 1 
          }

      - name: Zip Windows App
        run: |
          if (Test-Path build-win) {
            Compress-Archive -Path build-win\* -DestinationPath markdown-article-editor-windows.zip
          } else {
            Write-Error "build-win folder missing"
            exit 1
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-article-editor-windows-app
          path: markdown-article-editor-windows.zip
